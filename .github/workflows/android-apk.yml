name: Build and publish Soma AI APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build phone debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

      # This upstream repository intentionally does not include a Gradle wrapper.
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
          cache-provider: basic

      - name: Build phone APK
        shell: bash
        run: |
          gradle \
            -Dorg.gradle.jvmargs="-Xms512m -Xmx4g -Dfile.encoding=UTF-8" \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            assemblePhoneDebug

      - name: Verify APK identity and privacy
        shell: bash
        run: |
          apk_path="$(find build/outputs/apk/phone/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          aapt2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -x "$aapt2"

          badging="$("$aapt2" dump badging "$apk_path")"
          grep -F "package: name='com.kefamgaya.somaai'" <<< "$badging"
          grep -F "launchable-activity: name='com.google.android.accessibility.talkback.study.StudyModeActivity'" <<< "$badging"

          permissions="$(sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          unexpected="$(grep -vFx 'android.permission.INTERNET' <<< "$permissions" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected permissions in APK:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          apk_path="$(find build/outputs/apk/phone/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA:0:7}"
          fi

          mkdir -p dist
          destination="dist/Soma-AI-${version}.apk"
          cp "$apk_path" "$destination"
          echo "path=$destination" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: talkback-ai-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APK
        uses: actions/download-artifact@v8
        with:
          name: talkback-ai-apk
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          apk_path="$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          gh release create "$GITHUB_REF_NAME" \
            "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Soma AI $GITHUB_REF_NAME"
